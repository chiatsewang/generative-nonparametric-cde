[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "generative-nonparametric-cde"
version = "1.0.0"
description = "A benchmark comparing traditional statistical methods and generative modeling approaches for conditional density estimation"
authors = [{name = "Chiatse Wang", email = "chiatsewang@stat.sinica.edu.tw"}]
readme = "README.md"
license = {text = "GPL-2.0"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "torch>=1.11.0",
    "PyYAML>=6.0.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.62.0",
    "typing_extensions",
    "pywavelets>=1.4.0",
    "POT>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
]
flexcode = [
    "flexcode @ git+https://github.com/lee-group-cmu/FlexCode.git",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["condgen_benchmark*"]

[tool.black]
line-length = 79
target-version = ['py311']

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
]

ignore = [
    "E501",   # line too long, handled by black
]
